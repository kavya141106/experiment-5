<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Weather App | Fetch API</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">Experiment 5: Live Weather App</a>
            <a href="../index.html" class="btn btn-outline-light btn-sm">← Back to Hub</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <!-- Search Card -->
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-info text-dark py-3">
                        <h4 class="mb-0 text-center fw-bold">Live Weather Forecast</h4>
                    </div>
                    <div class="card-body p-4">
                        <form id="weatherForm" class="row g-2">
                            <div class="col-8 col-sm-9">
                                <label for="cityInput" class="visually-hidden">City Name</label>
                                <input type="text" id="cityInput" class="form-control" placeholder="Enter city (e.g. Noida, Delhi, London)..." required>
                            </div>
                            <div class="col-4 col-sm-3">
                                <button type="submit" id="searchBtn" class="btn btn-primary w-100">Search</button>
                            </div>
                        </form>

                        <!-- Preset Quick Buttons -->
                        <div class="mt-3 text-center">
                            <span class="small text-muted me-2">Quick Cities:</span>
                            <button type="button" class="btn btn-outline-secondary btn-sm quick-btn" data-city="Noida">Noida</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm quick-btn" data-city="Delhi">Delhi</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm quick-btn" data-city="Mumbai">Mumbai</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm quick-btn" data-city="London">London</button>
                        </div>
                    </div>
                </div>

                <!-- Alert Messages -->
                <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

                <!-- Loading Spinner -->
                <div id="loadingSpinner" class="text-center my-4 d-none">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading weather...</span>
                    </div>
                    <p class="mt-2 text-muted">Fetching meteorological data...</p>
                </div>

                <!-- Weather Results Display Card -->
                <div id="weatherResult" class="card shadow-sm border-0 text-center d-none">
                    <div class="card-body p-4">
                        <h3 id="cityName" class="card-title fw-bold text-dark mb-1">Noida, India</h3>
                        <p id="weatherTime" class="text-muted small mb-3">Live Status</p>

                        <div class="my-3">
                            <span id="temperature" class="display-3 fw-bold text-primary">28°C</span>
                        </div>

                        <p id="weatherCondition" class="fs-5 fw-semibold text-secondary mb-4">Clear Sky</p>

                        <div class="row g-2 border-top pt-3">
                            <div class="col-6 col-sm-4">
                                <small class="text-muted d-block">Wind Speed</small>
                                <strong id="windSpeed" class="fs-6">12 km/h</strong>
                            </div>
                            <div class="col-6 col-sm-4">
                                <small class="text-muted d-block">Wind Direction</small>
                                <strong id="windDirection" class="fs-6">180°</strong>
                            </div>
                            <div class="col-12 col-sm-4 mt-2 mt-sm-0">
                                <small class="text-muted d-block">Elevation</small>
                                <strong id="elevation" class="fs-6">200 m</strong>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
